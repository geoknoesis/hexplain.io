format: t
namespace: "https://example.org/hc-quoted-header-keys-yaml#"
structs:
  H:
    kind: header
    record-separator: 0x0A
    separator: 0x3D
    trim: true
    fields:
      - { key: samples, as: n, type: anum }
      - { key: "byte order", as: order, type: anum }
      - { key: bands, type: anum }
      - { name: lines, type: anum, if: "n > 0" }
