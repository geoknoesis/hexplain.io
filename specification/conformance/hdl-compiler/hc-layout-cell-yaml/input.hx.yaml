format: t
namespace: "https://example.org/hc-layout-cell-yaml#"
structs:
  Image:
    fields:
      - { name: w, type: u8 }
      - { name: h, type: u8 }
      - name: pixels
        type: bytes
        size: ".."
        layout:
          cell: u8
          dims:
            - { axis: Y, size: h }
            - { axis: X, size: w }
