format: t
namespace: "https://example.org/hc-switch-yaml#"
structs:
  Root:
    fields:
      - { name: kind, type: ascii, size: 4 }
      - name: body
        type: switch
        switch: { on: kind, cases: { IHDR: A, PLTE: B } }
  A:
    fields:
      - { name: a, type: u8 }
  B:
    fields:
      - { name: b, type: u16 }
