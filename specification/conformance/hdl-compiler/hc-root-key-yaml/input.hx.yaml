format: t
namespace: "https://example.org/hc-root-key-yaml#"
structs:
  Root:
    fields:
      - { name: recs, type: Rec, repeat: { count: 2 } }
      - { name: total, derive: root.alpha }
  Rec:
    fields:
      - { name: name, type: ascii, size: 5 }
      - { name: v, type: u8, root-key: name }
