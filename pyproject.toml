# Interpreter contract for the specification tooling. There is no installable package here: the
# gates are standalone scripts under tools/, and the dependencies are the hash-pinned locks
# (requirements.txt, compiled for the 3.12 target). The floor is what tools/_gate_runner.py
# asserts before running anything, and what CONTRIBUTING.md states.
[project]
name = "hexplain-specification-tools"
version = "0"
description = "Validation gates and generators for the Hexplain specification (proprietary; not distributed)"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]

# Lint configuration lives in ruff.toml (shared verbatim with the profile library).

# `pytest tools` runs each tools/test_*.py as one subprocess test through tools/conftest.py;
# `-n auto` parallelises them when pytest-xdist is installed. Neither pytest nor xdist is in
# the hash-pinned requirements: the acceptance command is `python tools/run_gates.py --strict`.
[tool.pytest.ini_options]
testpaths = ["tools"]
# The default Python collector must match nothing: tools/conftest.py collects the gate scripts.
python_files = ["__no_default_collection__.py"]
addopts = "-p no:cacheprovider"

# Type checking: `python -m mypy tools` (tools/test_types.py is the gate). The tools are scripts,
# not a package: every directory is an import root, because a script puts its own directory --
# and some a sibling one -- on sys.path. The bases say so, most specific first, which is what
# lets a module in tools/conformance be both checked and imported under its one top-level name.
[tool.mypy]
python_version = "3.11"
files = ["tools"]
explicit_package_bases = true
mypy_path = ["tools/conformance", "tools/codecs", "tools"]
# pyshacl, psutil, pytest and Playwright ship no usable types or are optional installs.
ignore_missing_imports = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_return_any = false

# One codec script imports a conformance module by its package path (`conformance.lz4frames`)
# while every other importer uses the top-level name; following both would give one file two
# module names, which mypy refuses. The package-path import is left unfollowed.
[[tool.mypy.overrides]]
module = ["conformance.*"]
follow_imports = "skip"
