<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found · Hexplain</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/hexplain.io/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/hexplain.io/favicon.ico" sizes="32x32">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:#0b0e14;color:#e7edf5;line-height:1.6;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-image:
      radial-gradient(680px 420px at 82% -6%, rgba(34,211,238,.14), transparent 60%),
      radial-gradient(720px 480px at 12% 4%, rgba(167,139,250,.13), transparent 60%);
  }
  .box{max-width:520px}
  .mark{width:56px;height:56px;margin:0 auto 22px;display:block}
  .code{
    font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:#67e8f9;border:1px solid #232c3d;border-radius:999px;padding:6px 14px;display:inline-block;margin-bottom:22px;
  }
  h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
  .grad{background:linear-gradient(120deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#93a1b5;margin:0 0 30px;font-size:1.05rem}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:12px 22px;border-radius:11px;border:1px solid transparent;transition:transform .15s ease}
  .btn:hover{transform:translateY(-2px)}
  .primary{background:linear-gradient(120deg,#22d3ee,#a78bfa);color:#08121a}
  .ghost{background:#141a25;color:#e7edf5;border-color:#232c3d}
  a{text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      <path d="M16 2l12 7v14l-12 7L4 23V9z" fill="none" stroke="url(#mg)" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="16" y="21" font-family="ui-monospace,monospace" font-size="11" font-weight="700" fill="url(#mg)" text-anchor="middle">Hx</text>
    </svg>
    <span class="code">Error 404</span>
    <h1>These bytes don't <span class="grad">map to anything.</span></h1>
    <p>The page you're looking for isn't here. Let's get you back to something meaningful.</p>
    <div class="row">
      <a class="btn primary" href="/hexplain.io/">Back to home</a>
      <a class="btn ghost" href="/hexplain.io/specification/index.html">Read the specification</a>
    </div>
  </div>
</body>
</html>
