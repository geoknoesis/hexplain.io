# Shared lint contract. The profile library adopted this file's rule selection before ANN and
# C901 were added here; it takes those two over when its modules meet them, and until then
# everything above them is one convention for both repositories. The per-file entries at the
# end are this repository's own.
#
# Defect rules (undefined and unused names, syntax errors, the bugbear checks) and the style
# rules the specification tooling is written to: 120-column lines, no statement chaining
# (E701/E702), modern syntax (UP), simplifications (SIM), sorted imports (I), annotated
# signatures (ANN) and a bound on branching (C901). `ruff format` is the formatter;
# `ruff check --fix` applies the mechanical fixes.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "B", "UP", "SIM", "I", "ANN", "C901"]

ignore = [
    # Every flagged closure here is defined and called inside one loop iteration, a
    # per-iteration helper rather than a deferred callback. The rule's true positives
    # require the closure to outlive the iteration; the one handler that did was given
    # an explicit binding instead. Re-enable this if closures start being stored.
    "B023",
    # `Any` is the honest type of a parsed JSON document and of a value from an untyped
    # dependency, so it is not banned outright. What is bounded is its use as a return type:
    # tools/test_types.py counts the `-> Any` signatures and holds them under a ceiling.
    "ANN401",
]

[lint.mccabe]
# A function with more than fifteen decision points is split.
max-complexity = 15

# Modules that do not meet ANN and C901 yet. Each belongs to work in progress elsewhere (the
# conformance suite, the codec vector tooling, the requirement registry, the shape-text
# renderer) and was not edited when the two rules were adopted; tools/test_lint.py fails when
# an entry no longer has a finding, so the list can only shrink. Remove an entry with the
# change that brings its module into line; add none.
[lint.per-file-ignores]
"tools/_requirement_ids.py" = ["ANN", "C901"]
"tools/_shape_text.py" = ["ANN", "C901"]
"tools/test_codec_vector_completeness.py" = ["ANN"]
"tools/test_conformance_suite.py" = ["C901"]
"tools/test_vocab_shapes.py" = ["ANN"]
