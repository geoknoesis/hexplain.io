# Shared lint contract. The identical file governs the profile library, so one
# convention applies to both repositories.
#
# Defect rules (undefined and unused names, syntax errors, the bugbear checks) and the style
# rules the specification tooling is written to: 120-column lines, no statement chaining
# (E701/E702), modern syntax (UP), simplifications (SIM) and sorted imports (I). `ruff format`
# is the formatter; `ruff check --fix` applies the mechanical fixes.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "B", "UP", "SIM", "I"]

# Every flagged closure here is defined and called inside one loop iteration, a
# per-iteration helper rather than a deferred callback. The rule's true positives
# require the closure to outlive the iteration; the one handler that did was given
# an explicit binding instead. Re-enable this if closures start being stored.
ignore = ["B023"]
