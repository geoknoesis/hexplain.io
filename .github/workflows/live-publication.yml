name: Verify live publication
on:
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved; a SHA cannot), with the release
# it corresponds to in a comment. Dependabot's github-actions updates keep both current.
jobs:
  verify:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_live_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-publication
          path: review-2026-09-05/live-publication.json
