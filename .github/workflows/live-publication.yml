name: Verify live publication
on:
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/check_live_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-publication
          path: review-2026-09-05/live-publication.json
