name: Local publication and browser acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved; a SHA cannot), with the release
# it corresponds to in a comment. Dependabot's github-actions updates keep both current.
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/_check_site_browser.py
      - run: python tools/_check_local_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-publication-browser-evidence
          path: .gate-results/
          include-hidden-files: true
