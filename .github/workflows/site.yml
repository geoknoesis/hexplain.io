name: Local publication and browser acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved; a SHA cannot), with the release
# it corresponds to in a comment. Dependabot's github-actions updates keep both current.
jobs:
  publication:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright cannot install chromium.
    runs-on: ubuntu-24.04
    # Above the sum of the browser and docker gate timeouts of tools/gates.json (they run one
    # after the other; a job cancelled before a gate's own timeout uploads no gate record), with
    # room for installing the browser. tools/test_gate_manifest.py asserts the first part; the
    # timeouts are derived from tools/gate-costs.json (see "Gate cost" in CONTRIBUTING.md).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Hash-pinned: exactly the files in requirements-browser.txt, or the step fails.
      - run: python -m pip install --require-hashes -r requirements-browser.txt
      # The installed (pinned) Playwright package downloads the Chromium build it was released
      # with, so the browser version moves only when requirements-browser.in does.
      - run: python -m playwright install --with-deps chromium
      # The browser and docker gates are declared in tools/gates.json like the offline ones and
      # run through the same runner (timeouts, memory sampling, summary.json), one class per run
      # so each class has its own record.
      - run: python tools/run_gates.py --strict --class browser --json .gate-results/browser-summary.json
      - run: python tools/run_gates.py --strict --class docker --json .gate-results/docker-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: local-publication-browser-evidence
          path: .gate-results/
          include-hidden-files: true
