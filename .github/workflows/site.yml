name: Local publication and browser acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/_check_site_browser.py
      - run: python tools/_check_local_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-publication-browser-evidence
          path: .gate-results/
          include-hidden-files: true
