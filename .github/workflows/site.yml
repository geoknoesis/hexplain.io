name: Local publication and browser acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved; a SHA cannot), with the release
# it corresponds to in a comment. Dependabot's github-actions updates keep both current.
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Hash-pinned: exactly the files in requirements-browser.txt, or the step fails.
      - run: python -m pip install --require-hashes -r requirements-browser.txt
      # The installed (pinned) Playwright package downloads the Chromium build it was released
      # with, so the browser version moves only when requirements-browser.in does.
      - run: python -m playwright install --with-deps chromium
      - run: python tools/_check_site_browser.py
      - run: python tools/_check_local_publication.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-publication-browser-evidence
          path: .gate-results/
          include-hidden-files: true
