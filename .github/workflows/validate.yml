name: Specification gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Every action is pinned to a full commit SHA (a tag can be moved; a SHA cannot), with the release
# it corresponds to in a comment. Dependabot's github-actions updates keep both current.
jobs:
  actionlint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # actionlint checks every workflow's syntax, expressions, action inputs and `${{ }}` injection
      # into scripts, and runs shellcheck over each `run:` block. The release tarball is pinned by
      # its published SHA-256; shellcheck is preinstalled on the ubuntu runner image (and the step
      # fails if it is not, rather than silently linting without it).
      - name: Install actionlint 1.7.7
        env:
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          command -v shellcheck
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck "$(command -v shellcheck)"'

  validate:
    name: Gates (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # The gates are declared in tools/gates.json and run concurrently (--jobs 4 on a four-core
    # hosted runner), ordered and bounded by the tracked cost record tools/gate-costs.json. What
    # the suite costs, and on which host that was measured, is stated once, under "Gate cost" in
    # CONTRIBUTING.md, and tools/test_gate_manifest.py keeps those figures equal to the record;
    # no figure is repeated here to go stale. The same gate asserts that this limit exceeds the
    # longest gate timeout. A hosted runner has a fifth of the recording host's processors, so
    # the limit is several times the recorded wall clock.
    timeout-minutes: 90
    strategy:
      # Gate timings and the worker cap were both measured on Windows, and the published site is
      # built and served from Linux. Neither cancels the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: hexplain.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: hexplain.io
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Hash-pinned: exactly the files in requirements.txt, or the step fails.
      - run: python -m pip install --no-cache-dir --require-hashes -r requirements.txt
      - run: python tools/run_gates.py --strict --jobs 4
      # Durations and sampled peak RSS per gate, including the parallel gates' worker processes.
      # The memory-aware scheduling exists because a concurrent run exhausted host memory, so the
      # measurement that would have caught it belongs in the retained evidence.
      - name: Summarise gate cost
        if: always()
        run: python tools/_gate_cost.py .gate-results/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: specification-gates-${{ matrix.os }}-py${{ matrix.python }}
          path: hexplain.io/.gate-results/
          include-hidden-files: true
      # The review candidate archive is not tracked (22.9 MB of files the tree already holds);
      # it is rebuilt from the tree and checked against the tracked review-manifest.json hashes,
      # then retained as an artifact so a reviewer downloads exactly what the manifest pins.
      - name: Rebuild the review candidate archive
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/_review_candidate.py --archive-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: ontology-review-candidate
          path: hexplain.io/specification/ontology-review/ontology-review-candidate.zip
