name: Specification gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hexplain.io
    steps:
      - uses: actions/checkout@v4
        with:
          path: hexplain.io
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hexplain.io/requirements.txt
      - run: pip install -r requirements.txt
      - run: python tools/run_gates.py
