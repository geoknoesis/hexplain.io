<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowC" cx="88%" cy="0%" r="60%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="6%" cy="8%" r="55%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0b0e14"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>
  <rect width="1200" height="630" fill="url(#glowV)"/>

  <!-- faint hexagon motif, top-right, behind text -->
  <g opacity="0.10" transform="translate(1000,150) scale(11)" stroke="url(#grad)" stroke-width="0.6" fill="none">
    <path d="M16 2l12 7v14l-12 7L4 23V9z" stroke-linejoin="round"/>
  </g>

  <!-- brand -->
  <g transform="translate(80,54) scale(1.5)">
    <path d="M16 2l12 7v14l-12 7L4 23V9z" fill="none" stroke="url(#grad)" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="16" y="21" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="url(#grad)" text-anchor="middle">Hx</text>
  </g>
  <text x="142" y="90" font-size="36" font-weight="700" fill="#e7edf5">Hexplain</text>

  <!-- eyebrow -->
  <text x="82" y="172" font-family="Consolas,monospace" font-size="18" letter-spacing="3" fill="#67e8f9">THE SEMANTIC FRAMEWORK FOR BINARY DATA</text>

  <!-- headline -->
  <text x="78" y="254" font-size="64" font-weight="800" fill="#e7edf5">Give binary data a meaning</text>
  <text x="78" y="330" font-size="64" font-weight="800" fill="url(#grad)">machines can read.</text>

  <!-- subtext -->
  <text x="80" y="392" font-size="26" fill="#93a1b5">Turn opaque binary formats into queryable knowledge graphs.</text>

  <!-- standards -->
  <text x="82" y="500" font-family="Consolas,monospace" font-size="22" letter-spacing="1" fill="#c6d2e1">RDF<tspan fill="#3d4757">   ·   </tspan>OWL<tspan fill="#3d4757">   ·   </tspan>SHACL<tspan fill="#3d4757">   ·   </tspan>JSON-LD<tspan fill="#3d4757">   ·   </tspan>SPARQL</text>

  <!-- accent underline -->
  <rect x="82" y="524" width="360" height="3" rx="1.5" fill="url(#grad)"/>

  <!-- footer credit -->
  <text x="1120" y="566" font-family="Consolas,monospace" font-size="18" fill="#6b7889" text-anchor="end">github.com/geoknoesis/hexplain.io</text>
</svg>
